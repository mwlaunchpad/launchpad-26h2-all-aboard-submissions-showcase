<!doctype html>
<html lang="en" data-base="%BASE%" data-build="%BUILD%" data-kid="%KEYID%" data-session-hours="%SESSION_HOURS%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>LaunchPad '26 · Sign in</title>
    <link rel="icon" type="image/png" href="%BASE%_shell/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" />
    <link rel="stylesheet" href="%BASE%_shell/login.css" />
  </head>
  <body>
    <main class="gate">
      <section class="gate__art" aria-hidden="true">
        <svg viewBox="0 0 400 400" fill="none">
          <g stroke="currentColor" stroke-width="1">
            <circle cx="200" cy="200" r="40" /><circle cx="200" cy="200" r="62" /><circle cx="200" cy="200" r="84" />
            <circle cx="200" cy="200" r="106" /><circle cx="200" cy="200" r="128" /><circle cx="200" cy="200" r="150" />
            <circle cx="200" cy="200" r="172" /><circle cx="200" cy="200" r="194" />
          </g>
        </svg>
        <div class="gate__brand">
          <img src="%BASE%_shell/logo.png" width="40" height="40" alt="" />
          <span>LaunchPad</span><em>'26</em>
        </div>
        <h1>The showcase is <em>members only.</em></h1>
        <p>Modern Workplace Engineering · LBG</p>
      </section>
      <section class="gate__panel">
        <form class="card" id="login" autocomplete="on" novalidate>
          <span class="tile">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
          </span>
          <div class="eyebrow">Sign in</div>
          <h2>Welcome <span class="grad">aboard.</span></h2>
          <p class="sub">Use the username and password you were given.</p>
          <div class="field">
            <label for="u">Username</label>
            <input class="input" id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required />
          </div>
          <div class="field">
            <label for="p">Password</label>
            <input class="input" id="p" name="password" type="password" autocomplete="current-password" required />
          </div>
          <label class="check"><input type="checkbox" id="remember" /> Keep me signed in on this device for 7 days</label>
          <button class="btn" id="go" type="submit">Sign in →</button>
          <p class="msg" id="msg" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <script src="%BASE%_shell/login.js"></script>
  </body>
</html>
